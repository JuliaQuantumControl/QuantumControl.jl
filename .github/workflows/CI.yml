name: CI
on:
  push:
    branches:
      - master
      - dev
      - 'release-*'
    tags:
      - '*'
  pull_request:
    branches:
      - master
  # Keep a warm `julia-actions/cache` entry on the default branch
  schedule:
    - cron: '0 4 * * 1,4'
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
permissions:
  contents: read
env:
  GKSwstype: 100
  ENVCHECK_URL: https://raw.githubusercontent.com/JuliaQuantumControl/JuliaQuantumControl/refs/heads/master/scripts/envcheck.jl
jobs:
  test:
    name: Test (Julia ${{ matrix.version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write  # for julia-actions/cache to delete the caches it created
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: "Check for unreleased sibling packages"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/envcheck.jl" "$ENVCHECK_URL"
          julia --startup-file=no "$RUNNER_TEMP/envcheck.jl" warn-sources test
      - uses: julia-actions/julia-runtest@v1
      - name: "Check for held-back dependencies"
        run: julia --startup-file=no "$RUNNER_TEMP/envcheck.jl" held-back test
      - uses: julia-actions/julia-processcoverage@v1
      - name: "Summarize coverage"
        shell: julia --startup-file=no {0}
        run: |
          import Pkg
          Pkg.activate(; temp = true)
          Pkg.add(["CoverageTools", "LocalCoverage"])
          import CoverageTools
          import LocalCoverage
          coverage = CoverageTools.LCOV.readfile("lcov.info")
          show(stdout, LocalCoverage.eval_coverage_metrics(coverage, pwd()))
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  testoldest:
    name: Test (oldest Julia, lowest compat bounds)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write  # for julia-actions/cache to delete the caches it created
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'min'
      - uses: julia-actions/cache@v3
      - name: "Check for unreleased sibling packages"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/envcheck.jl" "$ENVCHECK_URL"
          julia --startup-file=no "$RUNNER_TEMP/envcheck.jl" warn-sources test
      - name: "Resolve lowest compatible versions"
        uses: julia-actions/julia-downgrade-compat@v2
        with:
          projects: ".,test"
          mode: "alldeps"
          julia_version: "min"  # must match the Julia version of the job
      - name: "Instantiate test environment"
        # Julia 1.10 ignores `[sources]`, so they are applied explicitly. The
        # downgrade also floors the test-only dependencies (including sibling
        # packages) to versions that may not be compatible with the package;
        # pinning the dependencies of the package to their lowest versions
        # re-resolves the remaining test dependencies.
        run: |
          cp test/Manifest.toml test/Manifest.lowest.toml
          julia --startup-file=no "$RUNNER_TEMP/envcheck.jl" apply-sources test
          julia --startup-file=no "$RUNNER_TEMP/envcheck.jl" pin-lowest test test/Manifest.lowest.toml
      - name: "Run tests"
        run: julia --color=yes --project=test --depwarn=yes --check-bounds=yes -e 'include("test/runtests.jl")'
  docs:
    # The build runs arbitrary code (all documentation dependencies), so it
    # gets no write access; the `docs-deploy` job deploys the result
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write  # for julia-actions/cache to delete the caches it created
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: "Check for unreleased sibling packages"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/envcheck.jl" "$ENVCHECK_URL"
          julia --startup-file=no "$RUNNER_TEMP/envcheck.jl" warn-sources docs
      - name: "Instantiate build environment"
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: "Build documentation"
        run: julia --project=docs docs/make.jl
      - uses: actions/upload-artifact@v7
        # For the `docs-deploy` job, and for reviewing pull requests from forks,
        # which get no preview
        name: Upload documentation
        with:
          name: docs-build
          path: |
            docs/build
            docs/Manifest.toml
          include-hidden-files: true  # for `.documenter-siteinfo.json`
          if-no-files-found: error
  docs-deploy:
    name: Deploy documentation
    needs: docs
    # Previews are deployed only for pull requests from branches of this
    # repository, not from forks (which cannot get a write token) or from
    # Dependabot (to not give write access to new versions of dependencies
    # before review). The author of a pull request, unlike `github.actor`,
    # cannot be spoofed.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # for Documenter to deploy to the `gh-pages` branch
      pull-requests: read  # for Documenter to check the origin of a pull request
      statuses: write  # for Documenter to report the deployment status
    steps:
      # No `julia-actions/cache`: a cache written by the `docs` job must not be
      # restored in a job with write access
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: docs-build
          path: docs
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: "Deploy documentation"
        run: julia --startup-file=no docs/deploy.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  codestyle:
    name: Codestyle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write  # for julia-actions/cache to delete the caches it created
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Get typos settings
        run: wget https://raw.githubusercontent.com/JuliaQuantumControl/JuliaQuantumControl/master/typos.toml
      - name: Spell Check
        uses: crate-ci/typos@v1.50.0
      - name: Version Check
        shell: julia {0}
        run: |
          using Pkg
          VERSION = VersionNumber(Pkg.TOML.parsefile("Project.toml")["version"])
          BRANCH = ENV["GITHUB_REF_NAME"]
          if ENV["GITHUB_EVENT_NAME"] == "pull_request"
              # For pull_request events, return the head (aka., "from") branch,
              # not the base (aka., "to") branch.
              BRANCH = ENV["GITHUB_HEAD_REF"]
          end
          if startswith(BRANCH, "release-")
              if (length(VERSION.prerelease) == length(VERSION.build))
                  println("Version $VERSION on release branch OK")
              else
                  @error "Invalid version $VERSION on release branch"
                  exit(1)
              end
          elseif ENV["GITHUB_REF_TYPE"] == "branch"
              # Any branch other than a release branch (master included) must
              # carry a dev suffix; release versions live only on release-* branches.
              if ("dev" in VERSION.prerelease) || ("dev" in VERSION.build)
                  println("Version $VERSION OK with dev-suffix on $BRANCH")
              else
                  @error "Invalid version $VERSION on branch $BRANCH: must contain dev suffix"
                  exit(1)
              end
          else
              println("Version $VERSION OK on $BRANCH")
          end
          exit(0)
      - name: "Check [sources]"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/envcheck.jl" "$ENVCHECK_URL"
          julia --startup-file=no "$RUNNER_TEMP/envcheck.jl" lint
      - name: "Apply code style and check changelog"
        run: make codestyle
      - name: Format Check
        shell: julia {0}
        run: |
          out = Cmd(`git diff -U0`) |> read |> String
          if out == ""
              exit(0)
          else
              @error "Some files have not been formatted !!!\n\n$out"
              exit(1)
          end
